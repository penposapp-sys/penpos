<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PenPOS | Restoran, Market, Mağaza ve Kantin POS Sistemi</title>
    <meta
      name="description"
      content="PenPOS ile restoran, market, mağaza ve kantin işletmenizi tek panelden yönetin. Stok takibi, adisyon, hızlı satış, QR menü, paket servis, mutfak yazıcısı ve gelişmiş raporlama sistemi."
    />
    <meta property="og:title" content="PenPOS | Restoran, Market, Mağaza ve Kantin POS Sistemi" />
    <meta property="og:description" content="Stok Takibi • QR Menü • Paket Servis • Adisyon • Hızlı Satış • Raporlama" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://penpos.cloud" />
    <meta property="og:image" content="https://penpos.cloud/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PenPOS | Restoran, Market, Mağaza ve Kantin POS Sistemi" />
    <meta name="twitter:description" content="Stok Takibi • QR Menü • Paket Servis • Adisyon • Hızlı Satış • Raporlama" />
    <meta name="twitter:image" content="https://penpos.cloud/og-image.jpg" />
    <link rel="icon" href="/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PenPOS",
        "url": "https://penpos.cloud",
        "description": "Restoran, market, mağaza ve kantin işletmeleri için POS sistemi",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web"
      }
    </script>
    <style>
      html, body, #root {
        min-height: 100%;
      }

      html {
        background: var(--app-bg, #f8fafc);
        color: var(--app-text, #0f172a);
      }

      body {
        margin: 0;
        background: var(--app-bg, #f8fafc);
        color: var(--app-text, #0f172a);
      }
    </style>
    <script>
      (function () {
        var THEME_KEY = 'penpos-theme-key';
        var DARK_MODE_KEY = 'penpos-dark-mode';
        function normalizeThemeId(value) {
          var raw = String(value || '').trim().toLowerCase();
          if (raw === 'white' || raw === 'default' || raw === 'mono') return 'white';
          if (raw === 'colored' || raw === 'ocean' || raw === 'emerald' || raw === 'amber' || raw === 'ruby' || raw === 'coffee' || raw === 'indigo' || raw === 'slate') return 'colored';
          return 'white';
        }
        function resolveThemeScope(pathname) {
          var path = String(pathname || '').toLowerCase();
          if (path.indexOf('/platform') === 0 || path.indexOf('/platform-login') === 0 || path.indexOf('/login/platform') === 0) return 'platform';
          if (path.indexOf('/canteen') === 0 || path.indexOf('/login/kantin') === 0) return 'canteen';
          if (path.indexOf('/kermes') === 0 || path.indexOf('/login/restoran') === 0) return 'kermes';
          return 'public';
        }
        function getScopedThemeKey(scope) {
          return THEME_KEY + ':' + String(scope || 'public');
        }
        function getScopedDarkModeKey(scope) {
          return DARK_MODE_KEY + ':' + String(scope || 'public');
        }
        function isMobileRuntimeBootstrap() {
          try {
            return window.matchMedia('(max-width: 768px)').matches || window.matchMedia('(pointer: coarse)').matches;
          } catch (error) {
            return false;
          }
        }
        function getLaunchSystemDarkMode() {
          try {
            return window.matchMedia('(prefers-color-scheme: dark)').matches === true;
          } catch (error) {
            return false;
          }
        }
        var themes = {
          white: {
            accent: '#111111',
            accentHover: '#27272a',
            accentSoft: '#f4f4f5',
            accentText: '#ffffff',
            sidebar: '#ffffff',
            topbar: '#ffffff',
            border: '#d1d5db',
            text: '#111111'
          },
          colored: {
            accent: '#ea7a1a',
            accentHover: '#d96a0c',
            accentSoft: '#f6e7dc',
            accentText: '#ffffff',
            sidebar: 'linear-gradient(180deg, #5b514c 0%, #4a433f 100%)',
            topbar: 'linear-gradient(90deg, #5b514c 0%, #4f4742 100%)',
            border: '#6a605b',
            text: '#111111'
          }
        };

        function buildRuntimeTheme(themeKey, darkMode) {
          var themeFamily = normalizeThemeId(themeKey);
          var baseTheme = themes[themeFamily] || themes.white;
          if (!darkMode) {
            if (themeFamily === 'white') {
              return Object.assign({}, baseTheme, {
                themeFamily: themeFamily,
                darkMode: false,
                appBg: '#f8fafc',
                appSurface: '#ffffff',
                appSurfaceSoft: '#f3f4f6',
                textPrimary: '#111111',
                textSecondary: '#374151',
                mutedText: '#6b7280',
                inputBg: '#ffffff',
                buttonBg: '#ffffff',
                buttonBorder: '#d1d5db',
                buttonText: '#111111',
                surfaceElevated: '#f1f5f9',
                cardShadow: '0 12px 28px rgba(15, 23, 42, 0.06)'
              });
            }

            return Object.assign({}, baseTheme, {
              themeFamily: themeFamily,
              darkMode: false,
              appBg: '#f8fafc',
              appSurface: '#ffffff',
              appSurfaceSoft: '#f8fafc',
              textPrimary: '#111111',
              textSecondary: '#374151',
              mutedText: '#6b7280',
              inputBg: '#ffffff',
              buttonBg: '#5b514c',
              buttonBorder: '#6a605b',
              buttonText: '#ffffff',
              surfaceElevated: '#f8fafc',
              cardShadow: '0 12px 28px rgba(15, 23, 42, 0.06)'
            });
          }

          if (themeFamily === 'white') {
            return Object.assign({}, baseTheme, {
              themeFamily: themeFamily,
              darkMode: true,
              accent: '#ffffff',
              accentHover: '#f4f4f5',
              accentSoft: '#2a2a2a',
              accentText: '#ffffff',
              appBg: '#1f1f1f',
              appSurface: '#242424',
              appSurfaceSoft: '#2a2a2a',
              sidebar: 'linear-gradient(180deg, #202020 0%, #171717 100%)',
              topbar: 'linear-gradient(90deg, #202020 0%, #171717 100%)',
              card: '#242424',
              border: '#3a3a3a',
              text: '#ffffff',
              textPrimary: '#ffffff',
              textSecondary: '#f1f1f1',
              mutedText: '#d6d6d6',
              surfaceElevated: '#2a2a2a',
              inputBg: '#242424',
              buttonBg: '#2a2a2a',
              buttonBorder: '#3a3a3a',
              buttonText: '#ffffff',
              cardShadow: '0 12px 28px rgba(0, 0, 0, 0.22)'
            });
          }

          return Object.assign({}, baseTheme, {
            themeFamily: themeFamily,
            darkMode: true,
            accent: '#ea7a1a',
            accentHover: '#f59e0b',
            accentSoft: '#3a312d',
            accentText: '#ffffff',
            appBg: '#1f1f1f',
            appSurface: '#242424',
            appSurfaceSoft: '#2a2a2a',
            sidebar: 'linear-gradient(180deg, #3f3936 0%, #2e2927 100%)',
            topbar: 'linear-gradient(90deg, #3f3936 0%, #342f2c 100%)',
            card: '#242424',
            border: '#4a4340',
            text: '#ffffff',
            textPrimary: '#ffffff',
            textSecondary: '#f1f1f1',
            mutedText: '#d6d6d6',
            surfaceElevated: '#2a2a2a',
            inputBg: '#242424',
            buttonBg: '#3f3936',
            buttonBorder: '#5b514c',
            buttonText: '#ffffff',
            cardShadow: '0 12px 28px rgba(0, 0, 0, 0.22)'
          });
        }

        try {
          var scope = resolveThemeScope(window.location && window.location.pathname);
          var isPublicScope = scope === 'public';
          var isMobileRuntime = isMobileRuntimeBootstrap();
          var launchSystemDarkMode = getLaunchSystemDarkMode();
          window.__PENPOS_MOBILE_LAUNCH_DARK__ = launchSystemDarkMode;
          var themeKey = isPublicScope ? 'white' : normalizeThemeId(localStorage.getItem(getScopedThemeKey(scope)) || 'white');
          var darkMode = isPublicScope ? false : (isMobileRuntime ? launchSystemDarkMode : (localStorage.getItem(getScopedDarkModeKey(scope)) === 'true'));
          var theme = buildRuntimeTheme(themeKey, darkMode);
          var root = document.documentElement;
          root.dataset.theme = theme.darkMode ? 'dark' : 'light';
          root.classList.toggle('mobile-performance-mode', isMobileRuntime);
          root.classList.toggle('mobile-system-dark', isMobileRuntime && launchSystemDarkMode);
          root.classList.toggle('mobile-system-light', isMobileRuntime && !launchSystemDarkMode);
          root.classList.toggle('tenant-dark-mode', !isPublicScope && !isMobileRuntime && darkMode);
          root.classList.toggle('theme-white', !isPublicScope && theme.themeFamily === 'white');
          root.classList.toggle('theme-colored', !isPublicScope && theme.themeFamily === 'colored');
          root.style.setProperty('--theme-accent', theme.accent);
          root.style.setProperty('--theme-accent-hover', theme.accentHover);
          root.style.setProperty('--theme-accent-soft', theme.accentSoft);
          root.style.setProperty('--theme-accent-text', theme.accentText);
          root.style.setProperty('--theme-card-bg', theme.card);
          root.style.setProperty('--theme-border', theme.border);
          root.style.setProperty('--theme-text', theme.text);
          root.style.setProperty('--theme-muted', theme.mutedText);
          root.style.setProperty('--app-bg', theme.appBg || theme.card);
          root.style.setProperty('--app-surface', theme.appSurface || theme.card);
          root.style.setProperty('--app-surface-soft', theme.appSurfaceSoft || theme.surfaceElevated);
          root.style.setProperty('--app-border', theme.border);
          root.style.setProperty('--app-text', theme.textPrimary || theme.text);
          root.style.setProperty('--app-text-secondary', theme.textSecondary || theme.mutedText);
          root.style.setProperty('--app-text-muted', theme.mutedText);
          root.style.setProperty('--app-input', theme.inputBg);
          root.style.setProperty('--app-button-bg', theme.buttonBg);
          root.style.setProperty('--panel', theme.card);
          root.style.setProperty('--panelElevated', theme.surfaceElevated);
          root.style.setProperty('--border', theme.border);
          root.style.setProperty('--text', theme.text);
          root.style.setProperty('--text-primary', theme.textPrimary || theme.text);
          root.style.setProperty('--text-secondary', theme.textSecondary || theme.mutedText);
          root.style.setProperty('--muted', theme.mutedText);
          root.style.setProperty('--input-bg', theme.inputBg);
          root.style.setProperty('--button-bg', theme.buttonBg);
          root.style.setProperty('--button-border', theme.buttonBorder);
          root.style.setProperty('--button-text', theme.buttonText || theme.textPrimary || theme.text);
          root.style.setProperty('--app-button-text', theme.buttonText || theme.textPrimary || theme.text);
          root.style.setProperty('--app-contrast-surface', theme.darkMode ? '#121211' : '#ffffff');
          root.style.setProperty('--app-contrast-text', theme.darkMode ? '#f4f1ec' : '#111111');
          root.style.setProperty('--app-contrast-border', theme.darkMode ? 'rgba(255,255,255,0.12)' : '#d1d5db');
          root.style.setProperty('--card-shadow', theme.cardShadow);
          document.addEventListener('DOMContentLoaded', function () {
            document.body.setAttribute('data-theme', theme.darkMode ? 'dark' : 'light');
            document.body.classList.toggle('mobile-performance-mode', isMobileRuntime);
            document.body.classList.toggle('mobile-system-dark', isMobileRuntime && launchSystemDarkMode);
            document.body.classList.toggle('mobile-system-light', isMobileRuntime && !launchSystemDarkMode);
            document.body.classList.toggle('tenant-dark-mode', !isPublicScope && !isMobileRuntime && darkMode);
            document.body.classList.toggle('theme-white', !isPublicScope && theme.themeFamily === 'white');
            document.body.classList.toggle('theme-colored', !isPublicScope && theme.themeFamily === 'colored');
          });
        } catch (error) {}
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
